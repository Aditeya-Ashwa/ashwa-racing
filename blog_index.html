<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Ashwa Racing</title>

  <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="assets/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Ashwa Racing" />
  <link rel="manifest" href="assets/images/favicon/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="assets/css/components/header.css">
  <link rel="stylesheet" href="assets/css/components/footer.css">
  <link rel="stylesheet" href="assets/css/pages/blog.css">
</head>
<body>

<header id="main-header"></header>

<!-- ═══════════════════════════
     HERO
════════════════════════════ -->
<section class="blog-hero">
  <div class="blog-hero-bg"></div>
  <div class="blog-hero-overlay"></div>
  <div class="blog-hero-grid"></div>
  <div class="blog-hero-stripe"></div>

  <div class="blog-hero-content">
    <div class="blog-eyebrow">
      <span class="eyebrow-dash"></span>
      <span>Engineering Log</span>
    </div>
    <h1 class="blog-hero-title">FROM THE<br><em>PADDOCK</em></h1>
    <p class="blog-hero-desc">
      Competition reports, engineering deep dives, testing insights,
      and team updates from across the Ashwa Racing programme.
    </p>
  </div>

  <!-- Filter bar pinned to hero bottom -->
  <div class="blog-filter-bar" id="blog-filter-bar">
    <button class="blog-filter-btn active" data-tag="all">All Posts</button>
    <!-- Tag buttons injected by JS -->
  </div>
</section>

<!-- ═══════════════════════════
     BLOG GRID
════════════════════════════ -->
<main class="blog-main">

  <!-- Featured post slot — first/latest post gets big treatment -->
  <div class="blog-featured" id="blog-featured">
    <!-- Injected by JS -->
  </div>

  <!-- Post count -->
  <div class="blog-meta-bar">
    <div class="blog-post-count" id="blog-post-count">— posts</div>
    <div class="blog-sort">
      <span class="blog-sort-label">Sort</span>
      <button class="blog-sort-btn active" id="sort-new">Newest</button>
      <button class="blog-sort-btn" id="sort-old">Oldest</button>
    </div>
  </div>

  <div class="blog-grid" id="blog-list">
    <!-- Cards injected by blog.js -->
  </div>

  <!-- Empty state -->
  <div class="blog-empty" id="blog-empty" hidden>
    <i class="fas fa-newspaper"></i>
    <p>No posts in this category yet.</p>
  </div>

</main>

<footer id="main-footer"></footer>

<script src="assets/js/components/header.js"></script>
<script src="assets/js/pages/blog.js"></script>

</body>
</html>
