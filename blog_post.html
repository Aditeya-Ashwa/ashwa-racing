<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post | Ashwa Racing</title>

  <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="assets/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Ashwa Racing" />
  <link rel="manifest" href="assets/images/favicon/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="assets/css/components/header.css" />
  <link rel="stylesheet" href="assets/css/components/footer.css" />
  <link rel="stylesheet" href="assets/css/pages/post.css" />
</head>
<body>

<header id="main-header"></header>

<!-- ── Reading progress bar ──────────────────────────── -->
<div class="post-progress" id="post-progress" aria-hidden="true">
  <div class="post-progress-bar" id="post-progress-bar"></div>
</div>

<!-- ── Post hero (populated by JS) ───────────────────── -->
<section class="post-hero" id="post-hero">
  <!-- Skeleton shown until JS populates -->
  <div class="post-hero-skeleton" id="post-hero-skeleton">
    <div class="phs-tag"></div>
    <div class="phs-title wide"></div>
    <div class="phs-title mid"></div>
    <div class="phs-meta"></div>
  </div>
</section>

<!-- ── Main content ───────────────────────────────────── -->
<main class="post-main">

  <!-- Back nav -->
  <div class="post-back">
    <a href="blog_index.html" class="post-back-link">
      <i class="fas fa-arrow-left"></i>
      <span>All Posts</span>
    </a>
  </div>

  <div class="post-layout">

    <!-- Article body -->
    <article class="post-article" id="post-content">
      <!-- Skeleton lines while fetching -->
      <div class="post-skeleton" id="post-skeleton">
        <div class="psk-line wide"></div>
        <div class="psk-line mid"></div>
        <div class="psk-line wide"></div>
        <div class="psk-line short"></div>
        <div class="psk-gap"></div>
        <div class="psk-line wide"></div>
        <div class="psk-line wide"></div>
        <div class="psk-line mid"></div>
        <div class="psk-gap"></div>
        <div class="psk-line wide"></div>
        <div class="psk-line short"></div>
        <div class="psk-line wide"></div>
      </div>
    </article>

    <!-- Sidebar TOC (populated by JS) -->
    <aside class="post-toc" id="post-toc" aria-label="Table of contents">
      <div class="post-toc-label">
        <span class="toc-dash"></span>In This Post
      </div>
      <nav id="post-toc-nav"></nav>
    </aside>

  </div>

  <!-- Post footer: tags + share -->
  <div class="post-footer-bar" id="post-footer-bar" hidden>
    <div class="post-tags" id="post-tags"></div>
    <div class="post-share">
      <span class="post-share-label">Share</span>
      <button class="post-share-btn" id="share-copy" aria-label="Copy link">
        <i class="fas fa-link"></i>
      </button>
      <a class="post-share-btn" id="share-twitter" href="#" target="_blank" rel="noopener" aria-label="Share on Twitter">
        <i class="fab fa-x-twitter"></i>
      </a>
      <a class="post-share-btn" id="share-linkedin" href="#" target="_blank" rel="noopener" aria-label="Share on LinkedIn">
        <i class="fab fa-linkedin-in"></i>
      </a>
    </div>
  </div>

</main>

<footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="assets/js/components/header.js"></script>
<script src="assets/js/pages/blog.js"></script>

</body>
</html>
