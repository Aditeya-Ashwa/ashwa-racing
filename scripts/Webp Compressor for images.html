<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebP Compressor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
  .sub { font-size: 0.85rem; color: #555; margin-bottom: 2rem; }

  .drop-zone {
    width: 100%; max-width: 720px;
    border: 1.5px dashed #2e2e2e;
    border-radius: 14px;
    padding: 2.5rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: #161616;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: #555; background: #1c1c1c; }
  .drop-zone svg { display: block; margin: 0 auto 0.75rem; color: #444; }
  .drop-zone p { font-size: 0.9rem; color: #999; }
  .drop-zone span { font-size: 0.78rem; color: #444; }

  .global-controls {
    display: none;
    width: 100%; max-width: 720px;
    background: #161616;
    border: 0.5px solid #2a2a2a;
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    margin-top: 1.25rem;
    gap: 1.25rem;
  }
  .global-controls.visible { display: flex; align-items: center; flex-wrap: wrap; gap: 1rem; }
  .ctrl-group { flex: 1; min-width: 200px; }
  .ctrl-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .ctrl-row label { font-size: 0.82rem; color: #888; }
  .ctrl-row .val { font-size: 0.82rem; font-weight: 600; }
  input[type=range] {
    width: 100%;
    -webkit-appearance: none; appearance: none;
    height: 4px; background: #2a2a2a; border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #e8e8e8; cursor: pointer;
  }

  .actions {
    display: none;
    width: 100%; max-width: 720px;
    margin-top: 0.75rem;
    gap: 10px;
  }
  .actions.visible { display: flex; }
  .btn {
    flex: 1; padding: 10px;
    border: none; border-radius: 10px;
    font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-primary { background: #e8e8e8; color: #0f0f0f; }
  .btn-primary:hover { background: #fff; }
  .btn-primary:disabled { background: #2a2a2a; color: #555; cursor: default; }
  .btn-secondary { background: #1e1e1e; color: #aaa; border: 0.5px solid #2a2a2a; }
  .btn-secondary:hover { background: #252525; }

  .summary {
    display: none;
    width: 100%; max-width: 720px;
    margin-top: 0.75rem;
  }
  .summary.visible { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: #161616; border: 0.5px solid #2a2a2a; border-radius: 10px; padding: 0.75rem 1rem; }
  .stat-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .stat-val { font-size: 1.05rem; font-weight: 600; }
  .stat-val.green { color: #4ade80; }

  .file-list { width: 100%; max-width: 720px; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 8px; }

  .file-item {
    background: #161616;
    border: 0.5px solid #2a2a2a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    transition: border-color 0.2s;
  }
  .file-item.done { border-color: #1f3a28; }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #222; flex-shrink: 0; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 0.72rem; color: #555; margin-top: 2px; }
  .progress-bar { width: 100%; height: 3px; background: #2a2a2a; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: #4ade80; border-radius: 2px; transition: width 0.25s; }
  .file-status { font-size: 0.72rem; font-weight: 600; flex-shrink: 0; }
  .file-status.green { color: #4ade80; }
  .file-status.red { color: #f87171; }
  .file-status.muted { color: #444; }
  .dl-single { background: none; border: 0.5px solid #2a2a2a; border-radius: 6px; padding: 4px 10px; font-size: 0.72rem; color: #888; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .dl-single:hover { background: #1e1e1e; color: #e8e8e8; }
</style>
</head>
<body>

<h1>WebP Compressor</h1>
<p class="sub">Bulk convert &amp; compress — all local, nothing uploaded</p>

<div class="drop-zone" id="drop-zone">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <p>Drop images here or click to browse</p>
  <span>PNG, JPG, WEBP, GIF — multiple files supported</span>
  <input type="file" id="file-input" accept="image/*" multiple style="display:none">
</div>

<div class="global-controls" id="global-controls">
  <div class="ctrl-group">
    <div class="ctrl-row">
      <label>Quality</label>
      <span class="val" id="q-val">80%</span>
    </div>
    <input type="range" id="quality" min="1" max="100" value="80" step="1">
  </div>
  <div class="ctrl-group">
    <div class="ctrl-row">
      <label>Max width</label>
      <span class="val" id="w-val">original</span>
    </div>
    <input type="range" id="resize" min="0" max="8" value="0" step="1">
  </div>
</div>

<div class="summary" id="summary">
  <div class="stat"><div class="stat-label">Files</div><div class="stat-val" id="s-count">0</div></div>
  <div class="stat"><div class="stat-label">Original total</div><div class="stat-val" id="s-orig">—</div></div>
  <div class="stat"><div class="stat-label">Saved</div><div class="stat-val green" id="s-saved">—</div></div>
</div>

<div class="actions" id="actions">
  <button class="btn btn-primary" id="dl-all-btn" disabled>Download all as ZIP</button>
  <button class="btn btn-secondary" id="clear-btn">Clear</button>
</div>

<div class="file-list" id="file-list"></div>

<canvas id="canvas" style="display:none"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const globalControls = document.getElementById('global-controls');
const qualitySlider = document.getElementById('quality');
const resizeSlider = document.getElementById('resize');
const qVal = document.getElementById('q-val');
const wVal = document.getElementById('w-val');
const fileListEl = document.getElementById('file-list');
const dlAllBtn = document.getElementById('dl-all-btn');
const clearBtn = document.getElementById('clear-btn');
const actionsEl = document.getElementById('actions');
const summaryEl = document.getElementById('summary');
const sCount = document.getElementById('s-count');
const sOrig = document.getElementById('s-orig');
const sSaved = document.getElementById('s-saved');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const widthOptions = [0,320,480,640,800,1024,1280,1920,2560];
const widthLabels  = ['original','320px','480px','640px','800px','1024px','1280px','1920px','2560px'];

let files = [];

function fmt(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(2) + ' MB';
}

function updateSummary() {
  const done = files.filter(f => f.blob);
  const origTotal = files.reduce((a,f) => a + f.origBytes, 0);
  const outTotal = done.reduce((a,f) => a + f.blob.size, 0);
  const saved = origTotal - outTotal;
  sCount.textContent = files.length;
  sOrig.textContent = fmt(origTotal);
  sSaved.textContent = done.length ? fmt(Math.max(0, saved)) : '—';
  dlAllBtn.disabled = done.length === 0;
}

function compressOne(entry) {
  return new Promise(resolve => {
    const q = parseInt(qualitySlider.value) / 100;
    const maxW = widthOptions[parseInt(resizeSlider.value)];
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (maxW && w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob => {
        entry.blob = blob;
        const saved = entry.origBytes - blob.size;
        const pct = Math.round((saved / entry.origBytes) * 100);
        entry.statusEl.textContent = fmt(blob.size) + (pct >= 0 ? ` · −${pct}%` : ` · +${Math.abs(pct)}%`);
        entry.statusEl.className = 'file-status ' + (pct >= 0 ? 'green' : 'red');
        entry.progressFill.style.width = '100%';
        entry.el.classList.add('done');
        entry.dlBtn.style.display = 'inline-block';
        updateSummary();
        resolve();
      }, 'image/webp', q);
    };
    img.src = URL.createObjectURL(entry.file);
  });
}

async function compressAll() {
  dlAllBtn.disabled = true;
  for (const entry of files) {
    entry.blob = null;
    entry.progressFill.style.width = '0%';
    entry.el.classList.remove('done');
    entry.statusEl.textContent = 'processing…';
    entry.statusEl.className = 'file-status muted';
    entry.dlBtn.style.display = 'none';
  }
  for (const entry of files) {
    await compressOne(entry);
  }
  updateSummary();
}

function makeFileItem(entry) {
  const el = document.createElement('div');
  el.className = 'file-item';

  const thumb = document.createElement('img');
  thumb.className = 'thumb';
  thumb.src = URL.createObjectURL(entry.file);

  const info = document.createElement('div');
  info.className = 'file-info';

  const name = document.createElement('div');
  name.className = 'file-name';
  name.textContent = entry.file.name;

  const meta = document.createElement('div');
  meta.className = 'file-meta';
  meta.textContent = fmt(entry.origBytes);

  const progressBar = document.createElement('div');
  progressBar.className = 'progress-bar';
  const progressFill = document.createElement('div');
  progressFill.className = 'progress-fill';
  progressFill.style.width = '0%';
  progressBar.appendChild(progressFill);

  const statusEl = document.createElement('span');
  statusEl.className = 'file-status muted';
  statusEl.textContent = 'queued';

  info.appendChild(name);
  info.appendChild(meta);
  info.appendChild(progressBar);

  const dlBtn = document.createElement('button');
  dlBtn.className = 'dl-single';
  dlBtn.textContent = 'Download';
  dlBtn.style.display = 'none';
  dlBtn.addEventListener('click', () => {
    if (!entry.blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(entry.blob);
    a.download = entry.name + '.webp';
    a.click();
  });

  el.appendChild(thumb);
  el.appendChild(info);
  el.appendChild(statusEl);
  el.appendChild(dlBtn);

  entry.el = el;
  entry.progressFill = progressFill;
  entry.statusEl = statusEl;
  entry.dlBtn = dlBtn;

  return el;
}

function addFiles(newFiles) {
  const existing = new Set(files.map(f => f.file.name + f.file.size));
  const toAdd = [...newFiles].filter(f => !existing.has(f.name + f.size));
  if (!toAdd.length) return;

  toAdd.forEach(file => {
    const entry = { file, name: file.name.replace(/\.[^.]+$/, ''), origBytes: file.size, blob: null };
    files.push(entry);
    fileListEl.appendChild(makeFileItem(entry));
  });

  globalControls.classList.add('visible');
  actionsEl.classList.add('visible');
  summaryEl.classList.add('visible');
  updateSummary();
  compressAll();
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

let recompressTimer;
function scheduleRecompress() {
  clearTimeout(recompressTimer);
  recompressTimer = setTimeout(compressAll, 350);
}

qualitySlider.addEventListener('input', () => { qVal.textContent = qualitySlider.value + '%'; scheduleRecompress(); });
resizeSlider.addEventListener('input', () => { wVal.textContent = widthLabels[+resizeSlider.value]; scheduleRecompress(); });

dlAllBtn.addEventListener('click', async () => {
  const done = files.filter(f => f.blob);
  if (!done.length) return;
  dlAllBtn.disabled = true;
  dlAllBtn.textContent = 'Zipping…';
  const zip = new JSZip();
  done.forEach(f => zip.file(f.name + '.webp', f.blob));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'webp-compressed.zip';
  a.click();
  dlAllBtn.disabled = false;
  dlAllBtn.textContent = 'Download all as ZIP';
});

clearBtn.addEventListener('click', () => {
  files = [];
  fileListEl.innerHTML = '';
  globalControls.classList.remove('visible');
  actionsEl.classList.remove('visible');
  summaryEl.classList.remove('visible');
  dlAllBtn.disabled = true;
});
</script>
</body>
</html>
