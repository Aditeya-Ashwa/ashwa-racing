<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Ashwa Racing</title>
    <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg" />
<link rel="shortcut icon" href="assets/images/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Ashwa Racing" />
<link rel="manifest" href="assets/images/favicon/site.webmanifest" />

    <!-- CSS FILES -->
    <link rel="stylesheet" href="assets/css/pages/contact.css">
    <link rel="stylesheet" href="assets/css/components/header.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body class="contact-body">

    <header id="main-header"></header>

    <section class="contact-section">
        <div class="contact-card">

            <!-- Left Side -->
            <div class="contact-info">
                <h1>Get In <span>Touch !</span></h1>
                <p>
                    Whether you're a student looking to join, a company interested in sponsorship,
                    or just a racing enthusiast, we'd love to hear from you. Reach out to Ashwa Racing today.
                </p>

                <div class="contact-details-item">
                    <i class="fas fa-phone-alt"></i>
                    <span>444447777</span>
                </div>

                <div class="contact-details-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:ashwaracing@gmail.com">ashwaracing@gmail.com</a>
                </div>

                <div class="contact-details-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>RV College of Engineering, Bengaluru</span>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="contact-form-container">
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" class="form-control" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <input type="email" class="form-control" placeholder="Email Address" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="tel" class="form-control" placeholder="Contact No">
                        </div>
                        <div class="form-group">
                            <input type="text" class="form-control" placeholder="Zip/Postal">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <textarea class="form-control" placeholder="Message"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Submit</button>
                </form>
            </div>

        </div>
    </section>

    <footer id="main-footer"></footer>

    <!-- Standard Header Script (if needed for nav) -->
    <script src="assets/js/components/header.js"></script>

</body>

</html>
